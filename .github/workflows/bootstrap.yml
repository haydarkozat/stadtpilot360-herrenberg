name: Bootstrap StadtPilot 360

on:
  push:
    branches: ["main"]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Reconstruct and verify project package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import string

          paths = sorted(Path(".bootstrap").glob("chunk-*"))
          raw = "".join(path.read_text(encoding="utf-8") for path in paths)
          allowed = set(string.ascii_letters + string.digits + "+/=")
          invalid = [(index, repr(char)) for index, char in enumerate(raw) if char not in allowed]
          clean = "".join(char for char in raw if char in allowed)

          print(f"chunks={len(paths)} raw_chars={len(raw)} invalid_chars={len(invalid)}")
          if invalid:
              print(f"first_invalid={invalid[:20]}")
          print(f"clean_chars={len(clean)} modulo_4={len(clean) % 4}")
          print(f"base64_sha256={hashlib.sha256(clean.encode('ascii')).hexdigest()}")

          archive = base64.b64decode(clean, validate=True)
          digest = hashlib.sha256(archive).hexdigest()
          print(f"archive_bytes={len(archive)} archive_sha256={digest}")
          expected = "bed0bf020fe38691deb18a097bf6976ca00488f2e6ce097c04258f073b0bf11b"
          if digest != expected:
              raise SystemExit(f"Archive checksum mismatch: expected {expected}, got {digest}")

          Path("/tmp/stadtpilot.tar.gz").write_bytes(archive)
          PY

      - name: Install project files
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/stadtpilot.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Launch StadtPilot 360 application"
          git push
