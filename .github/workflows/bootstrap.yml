name: Bootstrap StadtPilot 360

on:
  push:
    branches: ["main"]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify project package
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-* > /tmp/stadtpilot.tar.gz.b64
          base64 --decode /tmp/stadtpilot.tar.gz.b64 > /tmp/stadtpilot.tar.gz
          echo "bed0bf020fe38691deb18a097bf6976ca00488f2e6ce097c04258f073b0bf11b  /tmp/stadtpilot.tar.gz" | sha256sum --check -

      - name: Install project files
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/stadtpilot.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Launch StadtPilot 360 application"
          git push
