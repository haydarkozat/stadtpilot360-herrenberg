name: Clean temporary bootstrap files

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/cleanup-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Remove temporary transfer files
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .bootstrap ]; then
            git rm -r .bootstrap
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No temporary files remain."
          else
            git commit -m "Remove temporary bootstrap files"
            git push
          fi
