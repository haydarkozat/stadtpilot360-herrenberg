  <text x="465" y="232" fill="#d8ff52" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">AUSSCHREIBUNG → FUNKTIONIERENDER PROTOTYP</text>
  <text x="465" y="300" fill="#fff" font-family="Arial, sans-serif" font-size="44" font-weight="700">Ich habe Ihre Stelle nicht nur gelesen.</text>
  <text x="465" y="356" fill="#d8ff52" font-family="Arial, sans-serif" font-size="44" font-style="italic" font-weight="700">Ich habe sie prototypisch umgesetzt.</text>
