  <text x="410" y="92" fill="#55716a" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">ZUKUNFTSMACHER/IN · JUNIOR PROJEKTLEITUNG</text>
  <text x="410" y="137" fill="#102d27" font-family="Arial, sans-serif" font-size="34" font-weight="700">Mission Control</text>
